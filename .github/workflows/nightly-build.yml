name: Nightly Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      c_compiler:
        required: true
        type: string
      cpp_compiler:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      upload:
        required: false
        type: boolean
        default: true
      minimal:
        required: false
        type: boolean
        default: false
      lite:
        required: false
        type: boolean
        default: false
      artifact_suffix:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}

    # Windows full build uses the runner's default Python (as in the original).
    # Minimal build uses plain CMake, so it sets up Python 3.13 like the old shared file.
    - name: Use Python 3.13
      if: ${{ runner.os != 'Windows' || inputs.minimal }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "build-type=Release" >> "$GITHUB_OUTPUT"

    - name: Install deps and download libraries (Ubuntu)
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: python ./build_files/linux/install_linux_packages.py

    # Safeguard so `make ninja` always finds ninja. Remove if your runners already have it.
    - name: Install ninja
      run: python -m pip install ninja

    - name: Run make update
      working-directory: ${{ github.workspace }}
      run: python ./build_files/utils/make_update.py

    # ---------------- Windows ----------------
    - name: Build (Windows)
      if: ${{ runner.os == 'Windows' && !inputs.minimal }}
      shell: cmd
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (Windows)
      if: ${{ runner.os == 'Windows' && !inputs.minimal && inputs.upload }}
      uses: actions/upload-artifact@v4
      with:
        name: Bforartists-Nightly-${{ runner.os }}${{ inputs.artifact_suffix }}
        path: ${{ github.workspace }}/../*/bin
        retention-days: 14

    # ---------------- Linux ----------------
    - name: Build (Linux)
      if: ${{ runner.os == 'Linux' && !inputs.minimal }}
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (Linux)
      if: ${{ runner.os == 'Linux' && !inputs.minimal && inputs.upload }}
      uses: actions/upload-artifact@v4
      with:
        name: Bforartists-Nightly-${{ runner.os }}-${{ runner.arch }}${{ inputs.artifact_suffix }}
        path: ${{ github.workspace }}/../*/bin
        retention-days: 14

    # ---------------- MacOS ----------------
    - name: Build (macOS)
      if: ${{ runner.os == 'macOS' && !inputs.minimal }}
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (macOS)
      if: ${{ runner.os == 'macOS' && !inputs.minimal && inputs.upload }}
      uses: actions/upload-artifact@v4
      with:
        name: Blender-Release-${{ runner.os }}${{ inputs.artifact_suffix }}
        path: ${{ github.workspace }}/../*/bin
        retention-days: 14

    # ---------------- Minimal (Windows only, plain CMake + Ninja) ----------------
    - name: Configure CMake (minimal)
      if: ${{ inputs.minimal }}
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake -G Ninja -B "${{ steps.strings.outputs.build-output-dir }}" ^
          -C "${{ github.workspace }}/build_files/cmake/config/blender_lite.cmake" ^
          -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }} ^
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }} ^
          -DCMAKE_BUILD_TYPE=${{ steps.strings.outputs.build-type }} ^
          -S "${{ github.workspace }}"

    - name: Build (minimal)
      if: ${{ inputs.minimal }}
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build "${{ steps.strings.outputs.build-output-dir }}"
