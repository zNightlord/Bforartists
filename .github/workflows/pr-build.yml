name: PR Build

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'build') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      valid:   ${{ steps.parse.outputs.valid }}
      sha:     ${{ steps.parse.outputs.sha }}
      windows: ${{ steps.parse.outputs.windows }}
      linux:   ${{ steps.parse.outputs.linux }}
      macos:   ${{ steps.parse.outputs.macos }}
      minimal: ${{ steps.parse.outputs.minimal }}
      upload:  ${{ steps.parse.outputs.upload }}
    steps:
      - id: parse
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.comment.body.trim();
            // "build <platform|all> [upload]"  or  "build minimal" (no upload)
            const m = body.match(/^build\s+(?:(windows|linux|macos|all)(\s+upload)?|(minimal))$/i);
            if (!m) {
              core.setOutput('valid', 'false');
              return;
            }
            const target  = (m[1] || '').toLowerCase();
            const upload  = !!m[2];
            const minimal = !!m[3];
            const want = (p) => target === 'all' || target === p;
            const selected = {
              windows: want('windows'),
              linux:   want('linux'),
              macos:   want('macos'),
              minimal: minimal,
            };

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });

            core.setOutput('valid', 'true');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('upload', String(upload));

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            for (const [p, on] of Object.entries(selected)) {
              core.setOutput(p, String(on));
              if (!on) continue;
              await github.rest.repos.createCommitStatus({
                owner, repo,
                sha: pr.head.sha,
                state: 'pending',
                context: `Build ${p}`,
                description: upload ? 'Building + upload' : 'Building',
                target_url: runUrl,
              });
            }

  build-windows:
    needs: gate
    if: needs.gate.outputs.valid == 'true' && needs.gate.outputs.windows == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      upload: ${{ needs.gate.outputs.upload }}
      artifact_suffix: "-PR${{ github.event.issue.number }}"

  build-linux:
    needs: gate
    if: needs.gate.outputs.valid == 'true' && needs.gate.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      upload: ${{ needs.gate.outputs.upload }}
      artifact_suffix: "-PR${{ github.event.issue.number }}"

  build-macos:
    needs: gate
    if: needs.gate.outputs.valid == 'true' && needs.gate.outputs.macos == 'true'
    uses: ./.github/workflows/mac.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      upload: ${{ needs.gate.outputs.upload }}
      artifact_suffix: "-PR${{ github.event.issue.number }}"

  build-minimal:
    needs: gate
    if: needs.gate.outputs.valid == 'true' && needs.gate.outputs.minimal == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      upload: "false"
      minimal: "true"

  report:
    needs: [gate, build-windows, build-linux, build-macos, build-minimal]
    if: always() && needs.gate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/github-script@v8
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = needs.gate.outputs.sha;
            const upload = needs.gate.outputs.upload === 'true';
            const suffix = `-PR${context.issue.number}`;

            let artifacts = [];
            if (upload) {
              const res = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId, per_page: 100,
              });
              artifacts = res.data.artifacts.filter(a => a.name.endsWith(suffix));
            }

            const rows = [];
            for (const p of ['windows', 'linux', 'macos', 'minimal']) {
              const result = needs[`build-${p}`].result;
              if (result === 'skipped') continue;
              const ok = result === 'success';

              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state: ok ? 'success' : (result === 'cancelled' ? 'error' : 'failure'),
                context: `Build ${p}`,
                description: ok ? 'Build passed' : `Build ${result}`,
                target_url: runUrl,
              });

              let dl = '-';
              if (p !== 'minimal') {
                const art = artifacts.find(a => a.name.toLowerCase().includes(p));
                dl = art
                  ? `[${art.name}](${runUrl}/artifacts/${art.id})`
                  : (upload && ok ? 'artifact not found' : '-');
              }
              const label = p === 'minimal' ? 'windows (minimal)' : p;
              rows.push(`| ${label} | ${ok ? '✅ passed' : '❌ ' + result} | ${dl} |`);
            }

            const anyUploadable = ['windows', 'linux', 'macos']
              .some(p => needs[`build-${p}`].result !== 'skipped');
            const body = [
              `**Build finished** for \`${sha.slice(0, 7)}\``,
              '',
              '| Platform | Result | Download |',
              '|---|---|---|',
              ...rows,
              '',
              `[Workflow run](${runUrl})`,
              (!upload && anyUploadable)
                ? '_Built without upload. Comment `build <platform> upload` to get a download._'
                : '',
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body,
            });
