name: Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      upload:
        type: string
        required: false
        default: "true"
      lite:
        type: string
        required: false
        default: "false"
      minimal:
        type: string
        required: false
        default: "false"
      artifact_suffix:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/nightly-build.yml
    with:
      os: "windows-2022"
      c_compiler: "cl"
      cpp_compiler: "cl"
      ref: ${{ inputs.ref }}
      upload: ${{ inputs.upload != 'false' }}
      lite: ${{ inputs.lite == 'true' }}
      minimal: ${{ inputs.minimal == 'true' }}
      artifact_suffix: ${{ inputs.artifact_suffix }}
