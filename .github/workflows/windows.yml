name: Windows

on:
  issue_comment:
    types: [created]
  workflow_dispatch:          # optional: manual run

jobs:
  gate:
    # Only PR comments that say exactly "build", from trusted users
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == 'build' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'Windows build',
              description: 'Triggered by "build" comment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  build:
    needs: gate
    uses: ./.github/workflows/nightly-build.yml
    with:
      os: "windows-latest"
      c_compiler: "cl"
      cpp_compiler: "cl"
      ref: ${{ needs.gate.outputs.sha }}

  report:
    needs: [gate, build]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ needs.build.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.gate.outputs.sha }}',
              state: ok ? 'success' : 'failure',
              context: 'Windows build',
              description: ok ? 'Build passed' : 'Build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
