name: Android
on:
  push:
    branches: [ android ]
permissions: {}
env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_NDK_VERSION: "30.0.14904198"
  CMDLINE_TOOLS_VERSION: "11076708"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bforartists
        uses: actions/checkout@v4
        with:
          repository: zNightlord/Bforartists
          ref: android

      - name: Create Android SDK folder
        run: mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

      - name: Install Android cmdline-tools
        run: |
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools latest

      - name: Install NDK
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify NDK toolchain file exists
        run: |
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" || {
            echo "::error::android.toolchain.cmake not found under $ANDROID_NDK_ROOT"
            exit 1
          }

      - name: Install GCC 14 and set as default
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb12
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --set c++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Install build dependencies
        continue-on-error: true
        run: |
          sudo apt update
          sudo apt install -y python3 git git-lfs ninja-build
          echo "--- sanity check ---"
          pwd
          ls -la build_files/linux/install_linux_packages.py
          python3 ./build_files/linux/install_linux_packages.py
          python3 ./build_files/utils/make_update.py

      - name: Fix generator script shebangs, permissions, and line endings
        run: |
          find build_files source -type f -name '*.py' -print0 | \
          while IFS= read -r -d '' f; do
            sed -i 's/\r$//' "$f"
            head -n1 "$f" | grep -q '^#!' || sed -i '1i #!/usr/bin/env python3' "$f"
            [ -x "$f" ] || chmod +x "$f"
          done

      - name: Fix lib/android_arm64 submodule (SSH -> HTTPS)
        run: |
          git config submodule.lib/android_arm64.url \
            https://projects.blender.org/Brainzman/lib-android_arm64.git
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --progress lib/android_arm64

      - name: Fetch LFS content for android_arm64 libs
        working-directory: lib/android_arm64
        run: |
          git lfs install
          git lfs pull

      - name: Fetch upstream Vulkan-Headers (NDK's copy is stale)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$HOME/vulkan-headers"

      - name: Build Blender for Android
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          make android lite ninja BUILD_CMAKE_ARGS="-DTEST_PYTHON_EXE=$(command -v python3) -DCMAKE_CXX_FLAGS=-I$HOME/vulkan-headers/include -DCMAKE_C_FLAGS=-I$HOME/vulkan-headers/include"

      # - name: Locate and verify build output
      #   run: |
      #     find /home/runner/work/Bforartists -maxdepth 3 -iname '*android*' -type d
      #     ls -la /home/runner/work/Bforartists/build_android_lite/bin/5.3/ || true
          
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Bforartists-Android-${{ runner.os }}
          path: ${{ github.workspace }}/bfa_build_android_*/bin
